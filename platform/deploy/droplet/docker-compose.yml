# The Anthovai platform on k-garden-server.
#
# This box already runs eighteen containers of other people's production —
# finance, property, devicehub — on 3.8 GB of RAM with 2.4 GB of swap already
# in use. So every service here declares a memory limit. The limit is not for
# our benefit: without one, the kernel's OOM killer picks its own victim when
# memory runs out, and it is as likely to choose the finance database as
# anything of ours. With one, the process that exceeds its share is ours, and
# it is ours that dies.
#
# Ports are deliberately unusual. 8080 is taken on this host, and nothing here
# is published on 0.0.0.0 except the API — the database and the object store
# listen on localhost only, because they have no business being reachable from
# the internet.
#
#   docker compose --env-file /opt/anthovai/.env up -d
#
name: anthovai

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: anthovai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: anthovai
    # Tuned small on purpose. The defaults assume a machine that is not sharing
    # its memory with a finance system.
    command: >
      postgres
      -c max_connections=60
      -c shared_buffers=96MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=48MB
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    memswap_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anthovai -d anthovai"]
      interval: 10s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "127.0.0.1:9010:9000"
    volumes:
      - minio-data:/data
    mem_limit: 256m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD} &&
      mc mb --ignore-existing local/anthovai &&
      echo 'bucket ready'
      "
    mem_limit: 128m

  api:
    image: anthovai:deploy
    command: ["anthovai-api"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # 8080 belongs to something else on this host.
    ports:
      - "8090:8080"
    environment: &backend
      ANTHOVAI_ENV: production
      ANTHOVAI__DATABASE__URL: postgres://anthovai_api:${APP_DB_PASSWORD}@postgres:5432/anthovai
      ANTHOVAI__DATABASE__RUN_MIGRATIONS_ON_START: "false"
      ANTHOVAI__STORAGE__PROVIDER: s3
      ANTHOVAI__STORAGE__ENDPOINT: http://minio:9000
      ANTHOVAI__STORAGE__BUCKET: anthovai
      ANTHOVAI__STORAGE__REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      ANTHOVAI__SERVER__DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS}
      ANTHOVAI__MAIL__SITE_URL: ${SITE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      RUST_LOG: info,anthovai=info,sqlx=warn
    mem_limit: 384m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/internal/health"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  worker:
    image: anthovai:deploy
    command: ["anthovai-worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment: *backend
    mem_limit: 384m
    memswap_limit: 512m

volumes:
  postgres-data:
  minio-data:
