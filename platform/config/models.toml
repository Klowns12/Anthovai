# The model registry: the only file that names real provider models.
#
# Customers never see these names. They pick a policy (Anthovai Auto, or a
# provider on Business and above) and the router picks a row from here. That
# indirection is what lets a model be renamed, repriced, or retired without
# breaking a single customer integration.
#
# Prices are micro-USD per million tokens: 2_000_000 means USD 2.00 / MTok.
# Lower `priority` is tried first within a tier.
#
# `priced_on` is the date somebody last checked the two price fields against the
# provider's published figures. **A row without it will not start in
# production.** Every invoice is computed from those numbers, and a guess there
# produces a wrong bill that nothing else in the system contradicts.
#
# The model *names* below were verified against each provider's live API — for
# OpenAI, by `cargo test -p anthovai-provider-openai --test live -- --ignored`,
# which calls every enabled model and fails when one has been retired.

# ---- OpenAI ----------------------------------------------------------------
#
# Names confirmed live on 2026-09-05: all three answered, reported non-zero
# usage, and returned a finish reason we map.
#
# Prices below were read on 2026-09-07 from two independent trackers that agree
# to the cent (benchlm.ai, updated 2026-09-03; aipricing.guru, updated
# 2026-09-04). They are NOT from OpenAI's own page, which refused the request —
# so `priced_on` is deliberately still absent and production still will not
# start. Check these three rows against the figures on your own OpenAI billing
# page and add `priced_on = "…"` to each; that field means a person looked, and
# nothing else should ever set it.
#
# One thing those pages also said: gpt-5.5 is kept as legacy after OpenAI's
# current page moved on to gpt-5.6. It still answers — the live provider test
# calls it — but the large tier is sitting on a model the vendor has moved past,
# which is worth a decision before customers depend on it.

[[models]]
id = "openai-small"
provider = "openai"
name = "gpt-5.4-nano"
tier = "small"
max_context_tokens = 400000
max_output_tokens = 128000
input_price_micro_per_mtok = 200000
output_price_micro_per_mtok = 1250000
enabled = true
priority = 0

[[models]]
id = "openai-medium"
provider = "openai"
name = "gpt-5.4-mini"
tier = "medium"
max_context_tokens = 400000
max_output_tokens = 128000
input_price_micro_per_mtok = 750000
output_price_micro_per_mtok = 4500000
enabled = true
priority = 0

[[models]]
id = "openai-large"
provider = "openai"
name = "gpt-5.5"
tier = "large"
max_context_tokens = 400000
max_output_tokens = 128000
input_price_micro_per_mtok = 5000000
output_price_micro_per_mtok = 30000000
enabled = true
priority = 0

# ---- Anthropic --------------------------------------------------------------
#
# Off while we run on OpenAI keys only. Left in the file rather than deleted:
# these rows carry the context windows and tier placement, which are the part
# that takes research. Turning Anthropic on is setting `ANTHROPIC_API_KEY`,
# flipping `enabled`, and confirming the prices.
#
# Enabled-with-no-key was the previous state, and the factory dutifully warned
# about it at every startup — a warning that is noise once it is expected, and
# noise is how a real one gets missed.

[[models]]
id = "claude-small"
provider = "anthropic"
name = "claude-haiku-4-5"
tier = "small"
max_context_tokens = 200000
max_output_tokens = 32000
input_price_micro_per_mtok = 0
output_price_micro_per_mtok = 0
enabled = false
priority = 1

[[models]]
id = "claude-medium"
provider = "anthropic"
name = "claude-sonnet-5"
tier = "medium"
max_context_tokens = 1000000
max_output_tokens = 64000
input_price_micro_per_mtok = 0
output_price_micro_per_mtok = 0
enabled = false
priority = 1

[[models]]
id = "claude-large"
provider = "anthropic"
name = "claude-opus-5"
tier = "large"
max_context_tokens = 1000000
max_output_tokens = 64000
input_price_micro_per_mtok = 0
