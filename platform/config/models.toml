# The model registry: the only file that names real provider models.
#
# Customers never see these names. They pick a policy (Anthovai Auto, or a
# provider on Business and above) and the router picks a row from here. That
# indirection is what lets a model be renamed, repriced, or retired without
# breaking a single customer integration.
#
# Prices are micro-USD per million tokens: 2_000_000 means USD 2.00 / MTok.
# Lower `priority` is tried first within a tier.
#
# `priced_on` is the date somebody last checked the two price fields against the
# provider's published figures. **A row without it will not start in
# production.** Every invoice is computed from those numbers, and a guess there
# produces a wrong bill that nothing else in the system contradicts.
#
# The model *names* below were verified against each provider's live API — for
# OpenAI, by `cargo test -p anthovai-provider-openai --test live -- --ignored`,
# which calls every enabled model and fails when one has been retired.

# ---- OpenAI ----------------------------------------------------------------
#
# Names confirmed live on 2026-09-05: all three answered, reported non-zero
# usage, and returned a finish reason we map.
#
# Prices NOT confirmed. The figures below are placeholders and are wrong.
# Set `priced_on` on each row once they have been checked.

[[models]]
id = "openai-small"
provider = "openai"
name = "gpt-5.4-nano"
tier = "small"
max_context_tokens = 400000
max_output_tokens = 128000
input_price_micro_per_mtok = 0
output_price_micro_per_mtok = 0
enabled = true
priority = 0

