name: anthovai

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: anthovai
      POSTGRES_PASSWORD: anthovai
      POSTGRES_DB: anthovai
    ports:
      - "55432:5432"
    command: postgres -c max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anthovai -d anthovai"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: anthovai
      MINIO_ROOT_PASSWORD: anthovai-secret
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 anthovai anthovai-secret &&
      mc mb --ignore-existing local/anthovai-dev &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  minio-data:
